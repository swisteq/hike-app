spring:
  application:
    name: gorskie-wyprawy

  datasource:
    url: jdbc:postgresql://localhost:5432/gorskie_wyprawy
    username: gorskie
    password: gorskie_secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

app:
  uploads:
    dir: ./uploads/gpx
  jwt:
    secret: gorskie-wyprawy-super-secret-key-minimum-256-bits-long-change-in-production
    expiration-ms: 86400000


